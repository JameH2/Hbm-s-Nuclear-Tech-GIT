# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle


name: Java CI with Gradle

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "space-travel-twopointfive" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin' # Temurin because it's default :P

    # Calculate days since 10/10/10
    - name: Calculate days since 10/10/10
      id: calculate_days
      run: |
        start_date="2010-10-10"
        current_date=$(date +%Y-%m-%d)
        days_since=$(( ($(date -d "$current_date" +%s) - $(date -d "$start_date" +%s)) / 86400 ))
        echo "days=$days_since" >> $GITHUB_OUTPUT

    # Update version files with proper sed syntax
    - name: Update version files
      run: |
        days=${{ steps.calculate_days.outputs.days }}
        # Use proper sed syntax for Linux runners
        sed -i "s/public static final String VERSION = \".*\";/public static final String VERSION = \"1.0.27 BETA ($days)\";/" src/main/java/com/hbm/lib/RefStrings.java
        sed -i "s/mod_build_number=.*/mod_build_number=$days/" gradle.properties

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.6.0
      with:
        # Upload the built jar instead of the raw build/libs directory (which would get zipped)
        path: ./build/libs/*.jar

    # A release is only made when the mod was built from the spacetravel-two-pointfive branch
    - name: Calculate release tag
      id: release_tag
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/spacetravel-two-pointfive'
      run: |
        days=${{ steps.calculate_days.outputs.days }}
        base_tag="1.0.27_X${days}"
        # escape regex metacharacters (the dots) so the match is exact
        escaped=$(printf '%s' "$base_tag" | sed 's/[][\.^$*+?(){}|]/\\&/g')

        found=0
        highest=0
        while IFS= read -r line; do
          name="${line##*refs/tags/}"
          name="${name%"^{}"}"   # strip peeled annotated-tag suffix — quoted properly this time
          if [[ "$name" == "$base_tag" ]]; then
            found=1              # base tag taken → next must be at least _1
          elif [[ "$name" =~ ^${escaped}_([0-9]+)$ ]]; then
            found=1
            num="${BASH_REMATCH[1]}"
            if (( num > highest )); then
              highest=$num
            fi
          fi
        done < <(git ls-remote --tags origin "refs/tags/${base_tag}*")

        if (( found )); then
          tag="${base_tag}_$((highest + 1))"
        else
          tag="$base_tag"
        fi

        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Create Release
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/spacetravel-two-pointfive'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="${{ steps.release_tag.outputs.tag }}"
        jar=$(ls ./build/libs/HBM-NTM-*.jar | head -n 1)

        # gh interprets asset paths as glob patterns, so escape the [ ] in the jar name
        asset=$(printf '%s' "$jar" | sed 's/[][?*\\]/\\&/g')

        gh release create "$tag" "$asset" \
          --title "$tag" \
          --notes "Automated release build for the spacetravel-two-pointfive branch. Build number: ${{ steps.calculate_days.outputs.days }}" \
          --latest
