# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["space-travel-twopointfive"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin" # Temurin because it's default :P

      # Calculate days since 10/10/10
      - name: Calculate days since 10/10/10
        id: calculate_days
        run: |
          start_date="2010-10-10"
          current_date=$(date +%Y-%m-%d)
          days_since=$(( ($(date -d "$current_date" +%s) - $(date -d "$start_date" +%s)) / 86400 ))
          echo "days=$days_since" >> $GITHUB_OUTPUT

      # Update version files with proper sed syntax
      - name: Update version files
        run: |
          days=${{ steps.calculate_days.outputs.days }}
          # Use proper sed syntax for Linux runners
          sed -i "s/public static final String VERSION = \".*\";/public static final String VERSION = \"1.0.27 BETA ($days)\";/" src/main/java/com/hbm/lib/RefStrings.java
          sed -i "s/mod_build_number=.*/mod_build_number=$days/" gradle.properties

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Upload release JAR
        uses: actions/upload-artifact@v7
        with:
          path: |
            ./build/libs/HBM-NTM-*.jar
            !./build/libs/*-sources.jar
            !./build/libs/*-dev.jar
            !./build/libs/*-predowngrade.jar
            !./build/libs/*-api.jar
          archive: false
          if-no-files-found: error

      - name: Upload dev JAR
        uses: actions/upload-artifact@v7
        with:
          path: ./build/libs/HBM-NTM-*-dev.jar
          archive: false
          if-no-files-found: error

      # A release is only made when the mod was built from the space-travel-twopointfive branch
      - name: Calculate release tag
        id: release_tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/space-travel-twopointfive'
        run: |
          days=${{ steps.calculate_days.outputs.days }}
          base_tag="1.0.27_X${days}"
          # escape regex metacharacters (the dots) so the match is exact
          escaped=$(printf '%s' "$base_tag" | sed 's/[][\.^$*+?(){}|]/\\&/g')

          found=0
          highest=0
          while IFS= read -r line; do
            name="${line##*refs/tags/}"
            name="${name%"^{}"}"   # strip peeled annotated-tag suffix — quoted properly this time
            if [[ "$name" == "$base_tag" ]]; then
              found=1              # base tag taken → next must be at least _1
            elif [[ "$name" =~ ^${escaped}_([0-9]+)$ ]]; then
              found=1
              num="${BASH_REMATCH[1]}"
              if (( num > highest )); then
                highest=$num
              fi
            fi
          done < <(git ls-remote --tags origin "refs/tags/${base_tag}*")

          if (( found )); then
            tag="${base_tag}_$((highest + 1))"
          else
            tag="$base_tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/space-travel-twopointfive'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          jar=$(find ./build/libs -maxdepth 1 -type f \
            -name 'HBM-NTM-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-predowngrade.jar' \
            ! -name '*-api.jar' \
            -print -quit)
          if [ -z "$jar" ]; then
            echo "Release jar not found"
            exit 1
          fi

          # gh interprets asset paths as glob patterns, so escape the [ ] in the jar name
          asset=$(printf '%s' "$jar" | sed 's/[][?*\\]/\\&/g')

          gh release create "$tag" "$asset" \
            --title "$tag" \
            --notes "Automated release build for the space-travel-twopointfive branch. Build number: ${{ steps.calculate_days.outputs.days }}" \
            --latest
