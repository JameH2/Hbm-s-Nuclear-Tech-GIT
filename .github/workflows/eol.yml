name: Check line endings

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: eol-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check committed line endings
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'eol-fixes/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Checkout PR contents for inspection
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Check raw Git blobs
        run: python3 .github/scripts/normalize_eol.py --root pr --check
